name: Contract coverage

on:
  push:
    paths:
      - "contracts/**"
      - "coverage-thresholds.json"
      - "justfile"
      - ".github/workflows/coverage.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "coverage-thresholds.json"
      - "justfile"
      - ".github/workflows/coverage.yml"

jobs:
  contracts-coverage:
    name: contracts llvm-cov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry and llvm-cov binary
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/target/
          key: ${{ runner.os }}-llvm-cov-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-llvm-cov-

      - name: Install cargo-llvm-cov
        run: |
          if ! command -v cargo-llvm-cov >/dev/null 2>&1; then
            cargo install cargo-llvm-cov --locked
          fi
          cargo llvm-cov --version

      - name: Cargo fmt and clippy
        working-directory: contracts
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Run contract coverage with floor
        working-directory: contracts
        run: |
          THRESHOLD="$(python3 -c 'import json; print(json.load(open("../coverage-thresholds.json"))["contracts"]["lines"])')"
          echo "fail-under-lines=${THRESHOLD}"
          mkdir -p coverage
          cargo llvm-cov --workspace --tests \
            --ignore-filename-regex='(/tests?/|test\.rs$)' \
            --lcov --output-path coverage/lcov.info
          cargo llvm-cov report \
            --ignore-filename-regex='(/tests?/|test\.rs$)' \
            --fail-under-lines "${THRESHOLD}"

      - name: Upload lcov artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contracts-lcov
          path: contracts/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 30
